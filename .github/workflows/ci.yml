name: CI

# Tests and lint only. Images are built on the target server (§A1), so there is
# no registry push and no QEMU here — the arm64 build is proven by the deploy
# itself, and `--only-binary=:all:` in the api Dockerfile is what guarantees no
# wheel has to be compiled there.
#
# The deploy job (SSH to the server, run deploy.sh $GITHUB_SHA) arrives in P6
# together with the deploy scripts themselves, which P1 ships as loud stubs.
# Adding it now would fail every push to main by design.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api — ruff, env parity, pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ct
          POSTGRES_PASSWORD: ct
          POSTGRES_DB: competitortrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ct -d competitortrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A real PostgreSQL, because advisory locks and ON CONFLICT are exactly
      # what an in-memory database would fake (§A13).
      DATABASE_URL: postgresql+psycopg://ct:ct@localhost:5432/competitortrack_test
      # Without this, a missing service container would let the DB-backed tests
      # skip and the build would pass green on an empty suite.
      CT_REQUIRE_DB: "1"
      JWT_SECRET: ci-secret-not-for-production-0123456789
      MASTER_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PUBLIC_ORIGIN: http://localhost
      COOKIE_SECURE: "false"
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install runtime dependencies (wheels only)
        # Mirrors the Dockerfile: if a pinned dependency has no wheel, fail here
        # rather than compiling it on the Oracle A1 during a deploy.
        run: "python -m pip install --only-binary=:all: -r apps/api/requirements.txt"

      - name: Install dev dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: ruff check
        working-directory: apps/api
        run: ruff check .

      - name: ruff format --check
        working-directory: apps/api
        run: ruff format --check .

      - name: .env.example matches app/config.py
        run: python3 tools/check_env_example.py

      - name: pytest
        working-directory: apps/api
        run: pytest

  web:
    name: web — build, tsc, eslint, prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Build first: it generates next-env.d.ts and .next/types, which tsc and
      # eslint both read. It also type-checks, so a type error fails here too.
      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

  deploy-config:
    name: deploy — compose and Caddyfile validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Provide an environment for interpolation
        # The template's placeholder values are enough to validate structure;
        # nothing here is a real credential.
        run: cp .env.example deploy/.env

      - name: docker compose config (production)
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: docker compose config (with the local override)
        working-directory: deploy
        run: docker compose config --quiet

      - name: caddy validate (local HTTP profile)
        run: |
          docker run --rm \
            -e SERVER_NAME=http://localhost \
            -e ACME_EMAIL=dev@localhost \
            -e ACME_CA= \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: caddy validate (TLS profile, staging ACME)
        run: |
          docker run --rm \
            -e SERVER_NAME=app.example.com \
            -e ACME_EMAIL=ops@example.com \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
